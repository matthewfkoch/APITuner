[project]
name = "apituner-server"
version = "0.1.36"
description = "ADB-free virtual tuner server for Channels DVR and HDHomeRun clients"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
