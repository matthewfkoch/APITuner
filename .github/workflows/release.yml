name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apituner-release
  queue: max

env:
  REGISTRY: ghcr.io
  RELEASES_REPO: matthewfkoch/APITuner-releases

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Agent version
        id: version
        run: |
          gradle=agent/app/build.gradle.kts
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"$/\1/p' "$gradle")"
          code="$(sed -nE 's/^[[:space:]]*versionCode = ([1-9][0-9]*)$/\1/p' "$gradle")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || ! "$code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Set a valid versionName and positive versionCode in $gradle."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match Agent versionName $version (expected v$version)."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # Stable and prerelease APKs share the same Android application ID.
            while IFS= read -r tag; do
              [[ "$tag" == "$GITHUB_REF_NAME" ]] && continue
              previous_gradle="$(git show "refs/tags/$tag:$gradle" 2>/dev/null)" || continue
              previous_code="$(sed -nE 's/^[[:space:]]*versionCode = ([1-9][0-9]*)$/\1/p' <<< "$previous_gradle")"
              if [[ "$previous_code" =~ ^[1-9][0-9]*$ ]] && (( code <= previous_code )); then
                echo "::error::Agent versionCode $code must be greater than $previous_code from $tag."
                exit 1
              fi
            done < <(git tag --list 'v[0-9]*')
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test server and companion contract
        run: |
          pip install -r server/requirements.txt -r server/requirements-dev.txt
          python -m pytest server/tests integrations/fastchannels/test_external_player.py -q

  build-agent:
    needs: validate
    name: Build Agent APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    outputs:
      apk_name: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager not found under ${ANDROID_HOME}"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          test -d "${ANDROID_HOME}/platforms/android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: always

      # Secrets cannot be used in step-level if: expressions; detect via env in a script.
      - name: Prepare release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            if [[ ! -f keystore.jks ]]; then
              echo "::error::Failed to write keystore.jks"
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release signing enabled ($(wc -c < keystore.jks) bytes)"
          elif [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "::warning::KEYSTORE_BASE64 is set but KEYSTORE_PASSWORD, KEY_ALIAS, or KEY_PASSWORD is missing; building debug APK"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret; will build debug APK"
          fi

      - name: Require signing for published tags
        if: github.ref_type == 'tag' && steps.signing.outputs.enabled != 'true'
        run: |
          echo "::error::Tagged releases require the existing release signing key."
          exit 1

      - name: Build release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        if: steps.signing.outputs.enabled != 'true'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage release artifact
        id: apk
        shell: bash
        run: |
          ver="${{ needs.validate.outputs.version }}"
          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            name="apituner-agent-${ver}.apk"
            variant="release"
            src="app/build/outputs/apk/release/app-release.apk"
            tools="${ANDROID_HOME}/build-tools/36.0.0"
            "$tools/apksigner" verify "$src"
            badging="$("$tools/aapt" dump badging "$src")"
            if [[ "$badging" != *"versionCode='${{ needs.validate.outputs.code }}' versionName='$ver'"* ]]; then
              echo "::error::The signed APK version does not match the validated release version."
              exit 1
            fi
          else
            name="apituner-agent-${ver}-debug.apk"
            variant="debug"
            src="app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "$src" "${GITHUB_WORKSPACE}/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "variant=${variant}" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$src" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$src" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-apk
          path: ${{ github.workspace }}/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            status="✅ Passed"
          else
            status="❌ Failed"
          fi

          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            signing="✅ Release keystore"
          else
            signing="⚠️ Unsigned (debug fallback)"
          fi

          if [[ -n "${{ steps.apk.outputs.name }}" ]]; then
            artifact="✅ \`${{ steps.apk.outputs.name }}\`"
          else
            artifact="❌ APK not produced"
          fi

          {
            echo "## Release — Agent APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Status** | ${status} |"
            echo "| **Version** | ${{ needs.validate.outputs.version }} (${{ needs.validate.outputs.code }}) |"
            echo "| **Variant** | ${{ steps.apk.outputs.variant || '—' }} |"
            echo "| **Signing** | ${signing} |"
            echo "| **APK size** | ${{ steps.apk.outputs.size || '—' }} |"
            echo "| **SHA-256** | \`${{ steps.apk.outputs.sha256 || '—' }}\` |"
            echo "| **Trigger** | \`${{ github.event_name }}\` — \`${{ github.ref_name }}\` |"
            echo ""
            echo "**Artifact:** ${artifact} (uploaded as \`agent-apk\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-docker:
    needs: validate
    name: Publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.docker.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version tags
        id: meta
        run: |
          image="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/apituner"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ver="${{ needs.validate.outputs.version }}"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
            echo "tags=${{ env.REGISTRY }}/${image}:${ver}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "tags=${{ env.REGISTRY }}/${image}:dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Job summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            status="✅ Published"
          else
            status="❌ Failed"
          fi

          tags="${{ steps.meta.outputs.tags }}"
          tag_list="$(echo "$tags" | tr ',' '\n' | sed 's/^/- `/' | sed 's/$/`/')"

          {
            echo "## Release — Docker Image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Status** | ${status} |"
            echo "| **Version** | ${{ steps.meta.outputs.version }} |"
            echo "| **Platforms** | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| **Registry** | \`${{ env.REGISTRY }}\` |"
            echo "| **Repository** | \`${{ steps.meta.outputs.image }}\` |"
            echo "| **Digest** | \`${{ steps.docker.outputs.digest || '—' }}\` |"
            echo "| **Trigger** | \`${{ github.event_name }}\` — \`${{ github.ref_name }}\` |"
            echo ""
            echo "**Tags pushed:**"
            echo "${tag_list:-—}"
            echo ""
            echo "**Pull:**"
            echo "\`\`\`"
            echo "docker pull ${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  public-release:
    name: Publish public release
    needs: [validate, build-agent, publish-docker]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: agent-apk

      - name: Build latest.json manifest
        shell: bash
        run: |
          ver="${{ needs.validate.outputs.version }}"
          code="${{ needs.validate.outputs.code }}"
          apk="${{ needs.build-agent.outputs.apk_name }}"
          sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          apk_url="https://github.com/${RELEASES_REPO}/releases/download/${GITHUB_REF_NAME}/${apk}"
          python3 - <<PY
          import json
          manifest = {
              "versionName": "${ver}",
              "versionCode": int("${code}"),
              "apkUrl": "${apk_url}",
              "apkName": "${apk}",
              "sha256": "${sha}",
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Verify releases repo token
        env:
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if [[ -z "$RELEASES_REPO_TOKEN" ]]; then
            echo "::error::RELEASES_REPO_TOKEN is required to publish APKs to matthewfkoch/APITuner-releases"
            echo "Create a fine-grained PAT with Contents: Read and write on APITuner-releases, then add it as a repository secret."
            exit 1
          fi

      - name: Publish release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: APITuner v${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          make_latest: ${{ needs.validate.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          body: |
            ## Agent APK

            Download **${{ needs.build-agent.outputs.apk_name }}** below and install on each Android TV / Google TV device.

            Grant **Display over other apps**, **Usage Access**, and **Notification Access** (and **Accessibility** if you need BACK/HOME keys).

            In the APITuner dashboard, add a tuner with backend `http_agent`, device IP, port `9092`, and your HDMI encoder stream URL.

            Machine-readable update metadata: **latest.json** is attached to this release.
            The `releases/latest/download/latest.json` URL serves stable releases only.

            ## Server (Docker)

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ needs.publish-docker.outputs.image }}:${{ needs.validate.outputs.version }}
            ```

            Prereleases require the explicit version tag shown above.
            `:latest` tracks stable releases only.

            ## FastChannels (optional)

            Use a FastChannels build with **Bridge → External tuners** and install
            the official FastChannels Player on the TV. Enable **Bridge mode** and
            **Allow external tuners** in FastChannels, then enter its URL and generated
            token in **APITuner → Options → Connect FastChannels**. See the attached
            **FASTCHANNELS.md** for setup and troubleshooting.
          files: |
            ${{ needs.build-agent.outputs.apk_name }}
            latest.json
            docs/FASTCHANNELS.md
            docs/RELEASE-0.1.35-fastchannels.1.md
            integrations/fastchannels/external-player-v1.patch

      - name: Job summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            status="✅ Published"
          else
            status="❌ Failed"
          fi

          apk="$(ls -1 apituner-agent-*.apk 2>/dev/null | head -1 || true)"
          if [[ -n "$apk" ]]; then
            apk_info="\`${apk}\` ($(du -h "$apk" | cut -f1))"
          else
            apk_info="—"
          fi

          release_url="https://github.com/matthewfkoch/APITuner-releases/releases/tag/${{ github.ref_name }}"

          {
            echo "## Release — Public GitHub Release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Status** | ${status} |"
            echo "| **Version** | v${{ needs.validate.outputs.version }} |"
            echo "| **Release** | [${release_url}](${release_url}) |"
            echo "| **APK attached** | ${apk_info} |"
            echo "| **Docker image** | \`${{ env.REGISTRY }}/${{ needs.publish-docker.outputs.image }}:${{ needs.validate.outputs.version }}\` |"
            echo ""
            echo "**Published to:** \`matthewfkoch/APITuner-releases\` (public APK downloads)."
          } >> "$GITHUB_STEP_SUMMARY"

  promote-docker:
    name: Promote stable Docker image
    needs: [validate, publish-docker, public-release]
    if: github.ref_type == 'tag' && needs.validate.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag published digest as latest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.publish-docker.outputs.image }}
          DIGEST: ${{ needs.publish-docker.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
