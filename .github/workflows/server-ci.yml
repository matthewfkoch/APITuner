name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "integrations/fastchannels/**"
      - "docker-compose.yml"
      - ".github/workflows/server-ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "server/**"
      - "integrations/fastchannels/**"
      - "docker-compose.yml"
      - ".github/workflows/server-ci.yml"
      - ".github/workflows/release.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        id: syntax
        run: python -m compileall -q apituner

      - name: Lint (ruff)
        id: lint
        run: ruff check apituner tests

      - name: Python tests
        id: tests
        run: python -m pytest -q tests ../integrations/fastchannels/test_external_player.py --junitxml=test-results.xml

      - name: Web UI tests
        id: web_tests
        run: node --test tests/web/*.test.cjs

      - name: Build Docker image
        id: docker
        run: docker build -t apituner:ci .

      - name: Smoke test Docker image
        id: smoke
        run: |
          docker run --rm --entrypoint sh apituner:ci -c "command -v ffmpeg && command -v adb && command -v tesseract && python -c 'import apituner.main'"
          cid="$(docker run -d -p 127.0.0.1:16592:6592 -e APITUNER_PORT=6592 apituner:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:16592/api/status | grep -q '"version"'; then
              exit 0
            fi
            sleep 0.5
          done
          docker logs "$cid"
          exit 1

      - name: Job summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            status="✅ Passed"
          else
            status="❌ Failed"
          fi

          if [[ "${{ steps.syntax.outcome }}" == "success" ]]; then
            syntax="✅ Clean"
          elif [[ "${{ steps.syntax.outcome }}" == "skipped" ]]; then
            syntax="⏭️ Skipped"
          else
            syntax="❌ Errors"
          fi

          if [[ -f test-results.xml ]]; then
            tests="$(grep -oP 'tests="\K[0-9]+' test-results.xml | head -1)"
            failures="$(grep -oP 'failures="\K[0-9]+' test-results.xml | head -1)"
            errors="$(grep -oP 'errors="\K[0-9]+' test-results.xml | head -1)"
            skipped="$(grep -oP 'skipped="\K[0-9]+' test-results.xml | head -1)"
            time="$(grep -oP 'time="\K[0-9.]+' test-results.xml | head -1)"
            tests="${tests:-0}"
            failures="${failures:-0}"
            errors="${errors:-0}"
            skipped="${skipped:-0}"
            test_line="**${tests}** tests — ${failures} failed, ${errors} errors, ${skipped} skipped (${time}s)"
          elif [[ "${{ steps.tests.outcome }}" == "success" ]]; then
            test_line="✅ All tests passed"
          else
            test_line="❌ Tests did not complete"
          fi

          if [[ "${{ steps.lint.outcome }}" == "success" ]]; then
            lint="✅ Clean"
          elif [[ "${{ steps.lint.outcome }}" == "skipped" ]]; then
            lint="⏭️ Skipped"
          else
            lint="❌ Issues"
          fi

          if [[ "${{ steps.web_tests.outcome }}" == "success" ]]; then
            web_line="✅ Passed"
          elif [[ "${{ steps.web_tests.outcome }}" == "skipped" ]]; then
            web_line="⏭️ Skipped"
          else
            web_line="❌ Failed"
          fi

          if [[ "${{ steps.docker.outcome }}" == "success" && "${{ steps.smoke.outcome }}" == "success" ]]; then
            docker_line="✅ Built & smoke-tested"
          elif [[ "${{ steps.docker.outcome }}" == "success" ]]; then
            docker_line="⚠️ Built (smoke test failed)"
          elif [[ "${{ steps.docker.outcome }}" == "skipped" ]]; then
            docker_line="⏭️ Skipped"
          else
            docker_line="❌ Build failed"
          fi

          {
            echo "## APITuner Server CI"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Status** | ${status} |"
            echo "| **Python** | 3.11 |"
            echo "| **Syntax check** | ${syntax} |"
            echo "| **Ruff lint** | ${lint} |"
            echo "| **Web UI tests** | ${web_line} |"
            echo "| **Docker** | ${docker_line} |"
            echo "| **Trigger** | \`${{ github.event_name }}\` on \`${{ github.ref_name }}\` |"
            echo "| **Commit** | [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo ""
            echo "**Tests:** ${test_line}"
          } >> "$GITHUB_STEP_SUMMARY"
